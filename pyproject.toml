[project]
name = "lmlab"
version = "0.1.0"
description = "A learning laboratory for language models, GPU kernels, and inference engineering."
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.50.2",
    "jupyterlab",
    "matplotlib",
    "nnsight>=0.8.2",
    "numpy",
    "peft>=0.21.2",
    "torch",
    "transformers>=5.20.2",
    "trl>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypi torch is cpu-only on windows; native windows runs use the cuda 13.0 build.
# linux/wsl keeps the pypi wheel, which already ships cuda.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["resources/gpu-perf-engineering-resources"]
